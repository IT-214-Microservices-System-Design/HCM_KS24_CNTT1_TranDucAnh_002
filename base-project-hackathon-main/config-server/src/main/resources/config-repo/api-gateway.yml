spring:
  application:
    name: api-gateway
  config:
    import: optional:configserver:http://localhost:8888
  cloud:
    gateway:
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true
      routes:
        - id: genre-service
          uri: lb://genre-service
          predicates:
            - Path=/api/genres/**
        - id: movie-service
          uri: lb://movie-service
          predicates:
            - Path=/api/movies/**
